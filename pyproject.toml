[project]
name = "intern-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot[libero,smolvla,training]>=0.6.1",
    "mediapipe>=0.10.30",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.uv]
# opencv-python and opencv-python-headless both install the same `cv2` module.
# lerobot pulls the headless build, hf-libero/robosuite pull the GUI build, and
# whichever lands last wins; headless breaks cv2.imshow (needed for teleop).
# Keep exactly one provider: the GUI build, within lerobot's tested range.
override-dependencies = [
    "opencv-python>=4.9,<4.14",
    "opencv-python-headless; sys_platform == 'never'",  # marker never matches -> never installed
    "opencv-contrib-python; sys_platform == 'never'",   # mediapipe may pull this third cv2 provider
]
